# Exported from Render on 2026-08-01T07:14:00Z
version: "1"
projects:
- name: My project
  environments:
  - name: Production
    services:
    - type: web
      name: ultimate-music-bot
      runtime: python
      repo: https://github.com/Beasgohan-code/ultimate-music-bot
      # `main` is an unrelated history stuck at the pre-fix code: no Spotify
      # support, no error handling, and the broken assistant check that made
      # every group unplayable. Deploy the branch that carries the fixes until
      # main is reconciled.
      branch: arena/01a07134-ultimate-music-bot
      plan: free
      envVars:
      # Render's default is now Python 3.14, which is newer than ntgcalls and
      # TgCrypto target. .python-version pins 3.12; this is a belt-and-braces
      # duplicate because PYTHON_VERSION takes precedence over that file.
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUDO_USERS
        sync: false
      - key: API_HASH
        sync: false
      - key: API_ID
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: OWNER_ID
        sync: false
      region: frankfurt
      # FFmpeg is required for streaming and for the /song MP3 transcode.
      # Render's native Python runtime has no apt, so it is installed as a
      # pip-provided static binary and exposed on PATH by main.py.
      buildCommand: pip install -r requirements.txt
      startCommand: python main.py
      autoDeployTrigger: commit

